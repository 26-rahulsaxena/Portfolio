<body>
<main id="main" class="page" tabindex="-1">
  <section class="wrap page-head">
    <p class="label">Projects</p>
    <h1>Everything I've built and written</h1>
    <p class="lede">Research reports, models, dashboards and articles. Filter by type or search for a company, topic or tool.</p>
  </section>

  <section class="wrap" aria-label="Filter and search">
    <div class="controls">
      <div id="chips" class="chips" role="group" aria-label="Filter by type"></div>
      <div class="search">
        <label class="sr-only" for="search-input">Search projects</label>
        <input id="search-input" type="search" placeholder="Company, topic, tool" autocomplete="off">
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <div class="sort">
        <label class="sr-only" for="sort-select">Sort</label>
        <select id="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="featured">Featured first</option>
        </select>
      </div>
    </div>
    <p id="result-line" class="result-line label" aria-live="polite"></p>
  </section>

  <section class="wrap" aria-label="Projects">
    <div id="grid" class="grid-3"></div>
    <div id="empty" hidden></div>
    <div class="more-row"><button id="show-more" class="btn btn-glass glass" type="button" hidden>Show more</button></div>
    <p id="disclaimer" class="disclaimer label" hidden>Research reports are academic work, not investment advice.</p>
  </section>
